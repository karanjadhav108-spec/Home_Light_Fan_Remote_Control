<!DOCTYPE html>
<html>
<head>
  <title>Smart Switch Dashboard</title>

  <!-- Mobile-friendly viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 25px;
    }

    .btn {
      width: 100%;
      max-width: 420px;
      height: 80px;
      font-size: 22px;
      margin: 15px auto;
      border-radius: 12px;
      border: none;
      color: white;
      cursor: pointer;
      display: block;
    }

    .on {
      background-color: #2ecc71; /* green */
    }

    .off {
      background-color: #e74c3c; /* red */
    }

    .loading {
      background-color: #95a5a6; /* grey */
    }
  </style>
</head>

<body>

  <h2>My Smart Switch</h2>

  <button id="rl" class="btn loading" onclick="toggle('home/krn/rightlight')">
    Right Light: --
  </button>

  <button id="fan" class="btn loading" onclick="toggle('home/krn/fan')">
    Fan: --
  </button>

  <button id="ll" class="btn loading" onclick="toggle('home/krn/leftlight')">
    Left Light: --
  </button>

<script>
  const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

  client.on("connect", () => {
    console.log("Connected to MQTT");

    client.subscribe("home/krn/rightlight/state");
    client.subscribe("home/krn/fan/state");
    client.subscribe("home/krn/leftlight/state");
  });

  client.on("message", (topic, message) => {
    const state = message.toString();

    if (topic === "home/krn/rightlight/state")
      updateButton("rl", "Right Light", state);

    if (topic === "home/krn/fan/state")
      updateButton("fan", "Fan", state);

    if (topic === "home/krn/leftlight/state")
      updateButton("ll", "Left Light", state);
  });

  function toggle(topic) {
    client.publish(topic, "TOGGLE");
  }

  function updateButton(id, label, state) {
    const btn = document.getElementById(id);
    btn.textContent = label + ": " + state;
    btn.className = "btn " + (state === "ON" ? "on" : "off");
  }
</script>

</body>
</html>
